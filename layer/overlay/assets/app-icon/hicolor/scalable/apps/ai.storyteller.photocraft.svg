<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Loloshop</title>
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4e4"/>
      <stop offset="1" stop-color="#ffd8c4"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#field)"/>
    <!-- The heart she is painting. -->
    <path d="M372 478 C 324 444 308 418 318 394 C 328 372 358 370 372 394 C 386 370 416 372 426 394 C 436 418 420 444 372 478 Z" fill="#ff4f7b"/>
    <!-- Neck, with the mane down its back. -->
    <path d="M86 540 C 104 440 150 300 214 200 L 330 300 C 270 360 244 440 256 540 Z" fill="#7b2ff2"/>
    <path d="M84 540 C 102 440 148 300 212 200 L 232 196 C 176 300 140 420 126 540 Z" fill="#4c1a9e"/>
    <g fill="#5b22c2">
      <path d="M200 330 l 30 -10 l 14 22 l -18 22 l -28 -6 Z"/>
      <path d="M214 400 l 26 -6 l 10 24 l -20 18 l -22 -12 Z"/>
      <path d="M168 448 l 24 4 l 4 28 l -24 10 l -14 -20 Z"/>
      <path d="M220 480 l 24 -2 l 8 26 l -26 8 Z"/>
    </g>
    <!-- Head, tilted down toward the painting. -->
    <g transform="rotate(22 230 260)">
      <path d="M216 168 C 196 152 168 150 148 160 C 166 184 196 192 222 190 Z" fill="#6a25d6"/>
      <path d="M204 206 C 200 150 252 118 304 130 C 346 140 386 168 404 200 C 422 232 404 266 368 268 C 328 270 288 262 256 250 C 224 238 206 228 204 206 Z" fill="#7b2ff2"/>
      <ellipse cx="376" cy="230" rx="40" ry="36" fill="#a97bff"/>
      <ellipse cx="392" cy="214" rx="7" ry="4" fill="#3d1580" transform="rotate(-20 392 214)"/>
      <path d="M244 204 l 22 -6 l 8 18 l -16 12 l -18 -8 Z" fill="#5b22c2"/>
      <!-- A painter's beret, the ossicones poking out. -->
      <g stroke="#7b2ff2" stroke-width="14" stroke-linecap="round">
        <line x1="236" y1="132" x2="222" y2="92"/>
      </g>
      <circle cx="220" cy="86" r="13" fill="#4c1a9e"/>
      <path d="M232 140 C 226 104 290 88 344 104 C 372 112 376 132 352 142 C 318 156 262 158 232 140 Z" fill="#ff4f7b"/>
      <circle cx="300" cy="96" r="9" fill="#ff4f7b"/>
      <!-- A closed, happy eye. -->
      <path d="M282 184 C 292 196 310 196 318 184" fill="none" stroke="#2a0f55" stroke-width="7" stroke-linecap="round"/>
      <path d="M336 252 C 350 260 370 262 388 256" fill="none" stroke="#3d1580" stroke-width="6" stroke-linecap="round"/>
      <!-- The brush, held in the mouth. -->
      <g transform="translate(350 258) rotate(20)">
        <rect x="-40" y="-10" width="80" height="20" rx="10" fill="#3b2a20"/>
        <rect x="38" y="-13" width="28" height="26" rx="4" fill="#d9a441"/>
        <path d="M66 -14 C 96 -15 118 -5 130 0 C 118 5 96 15 66 14 Z" fill="#ff4f7b"/>
      </g>
    </g>
  </g>
</svg>
