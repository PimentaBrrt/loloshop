name: Release

# Every Sunday: take the newest PhotoCraft, apply the Loloshop layer, build, test and publish a
# release with Loloshop-windows-x64.exe. Nothing is published when PhotoCraft and the layer haven't
# changed since the last release, or when any step fails (the last release stays the latest).

on:
  schedule:
    - cron: "0 6 * * 0" # Sunday 06:00 UTC (03:00 in Brasilia)
  push:
    branches: [main]
    paths: ["layer/**", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: "PhotoCraft branch or commit"
        default: main
      skip_tests:
        description: "Publish without running the tests"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      TARGET: x86_64-pc-windows-msvc
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Keep the schedule alive
        # GitHub turns off scheduled workflows in public repos after 60 days without activity.
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            date -u +%F > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "Keep the weekly release schedule alive"
            git push
          fi

      - name: Build the Loloshop tree
        id: tree
        run: |
          bash layer/build-tree.sh upstream "${{ inputs.ref || 'main' }}"
          up=$(git -C upstream rev-parse HEAD~3)
          # The layer folder's tree hash: commits that leave layer/ alone (README, installer) don't
          # make a new release.
          tag="build-${up:0:9}-$(git rev-parse --short=7 HEAD:layer)"
          echo "upstream=$up" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "fonts=$(sed -n 's/^ *craft-fonts-ref: *\([0-9a-f]*\).*/\1/p' upstream/.github/workflows/release.yml)" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists: nothing new to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch craft-fonts
        if: steps.tree.outputs.skip != 'true' && steps.tree.outputs.fonts != ''
        run: |
          git init -q craft-fonts
          git -C craft-fonts fetch -q --depth=1 https://github.com/storytold/craft-fonts.git "${{ steps.tree.outputs.fonts }}"
          git -C craft-fonts checkout -q FETCH_HEAD
          echo "CRAFT_FONTS_DIR=$PWD/craft-fonts" >> "$GITHUB_ENV"

      - name: Rust
        if: steps.tree.outputs.skip != 'true'
        run: rustup update stable --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@v2
        if: steps.tree.outputs.skip != 'true'
        with:
          workspaces: upstream

      - name: Build
        if: steps.tree.outputs.skip != 'true'
        shell: pwsh
        working-directory: upstream
        env:
          # Static C runtime, as PhotoCraft's own Windows packages: no VC++ redistributable needed.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          PHOTOCRAFT_REQUIRE_WINRES: "1"
          PHOTOCRAFT_BUILD_SHA: ${{ steps.tree.outputs.upstream }}
        run: |
          cargo build --release --locked -p photocraft --features heif --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        if: steps.tree.outputs.skip != 'true' && !inputs.skip_tests
        shell: pwsh
        working-directory: upstream
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo test --release --locked --target $env:TARGET -p photocraft-ui-egui -p photocraft-engine -p photocraft -p photocraft-io -p photocraft-codecs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish
        if: steps.tree.outputs.skip != 'true'
        run: |
          up="${{ steps.tree.outputs.upstream }}"
          tag="${{ steps.tree.outputs.tag }}"
          mkdir -p dist
          cp "upstream/target/$TARGET/release/photocraft.exe" dist/Loloshop-windows-x64.exe
          {
            echo "Loloshop built from PhotoCraft [\`${up:0:9}\`](https://github.com/storytold/photocraft/commit/$up) and this repository at \`$(git rev-parse --short=7 HEAD)\`."
            prev=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
            prev_up=$(echo "$prev" | sed -n 's/^build-\([0-9a-f]*\)-.*/\1/p')
            if [ -n "$prev_up" ] && [ "$prev_up" != "${up:0:9}" ]; then
              echo
              echo "What's new in PhotoCraft since the last release: https://github.com/storytold/photocraft/compare/$prev_up...$up"
            fi
          } > dist/notes.md
          gh release create "$tag" dist/Loloshop-windows-x64.exe \
            --title "Loloshop $(date -u +%F) (PhotoCraft ${up:0:9})" \
            --notes-file dist/notes.md --latest
